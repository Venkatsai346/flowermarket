# TLS/cert-manager — automatic SSL certificate provisioning.
#
# Uses cert-manager with Let's Encrypt for free, auto-renewed certificates.
#
# Prerequisites:
#   helm install cert-manager jetstack/cert-manager -n cert-manager --set installCRDs=true

apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: ops@flowermarket.in
    privateKeySecretRef:
      name: letsencrypt-prod-key
    solvers:
      - http01:
          ingress:
            class: alb

---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: flowermarket-tls
  namespace: flowermarket
spec:
  secretName: flowermarket-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - api.flowermarket.in
    - admin.flowermarket.in
    - "*.flowermarket.in"
  duration: 2160h    # 90 days
  renewBefore: 720h  # Renew 30 days before expiry
