# External Secrets Operator — syncs secrets from AWS Secrets Manager to K8s.
#
# Prerequisites:
#   helm install external-secrets external-secrets/external-secrets -n external-secrets
#
# This replaces hardcoded K8s Secrets with references to AWS Secrets Manager.
# Secrets are synced every 1h and on-demand when the K8s secret is missing.

apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: flowermarket-aws
  namespace: flowermarket
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-south-1
      auth:
        jwt:
          serviceAccountRef:
            name: flowermarket

---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: flowermarket-secrets
  namespace: flowermarket
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: flowermarket-aws
    kind: SecretStore
  target:
    name: flowermarket-secrets
    creationPolicy: Owner
  data:
    - secretKey: MONGODB_URI
      remoteRef:
        key: flowermarket/production
        property: mongodb_uri

    - secretKey: JWT_SECRET
      remoteRef:
        key: flowermarket/production
        property: jwt_secret

    - secretKey: RAZORPAY_KEY_ID
      remoteRef:
        key: flowermarket/production
        property: razorpay_key_id

    - secretKey: RAZORPAY_KEY_SECRET
      remoteRef:
        key: flowermarket/production
        property: razorpay_key_secret

    - secretKey: RAZORPAYX_KEY_ID
      remoteRef:
        key: flowermarket/production
        property: razorpayx_key_id

    - secretKey: RAZORPAYX_KEY_SECRET
      remoteRef:
        key: flowermarket/production
        property: razorpayx_key_secret

    - secretKey: PAYOUT_WEBHOOK_SECRET
      remoteRef:
        key: flowermarket/production
        property: payout_webhook_secret

    - secretKey: SMS_API_KEY
      remoteRef:
        key: flowermarket/production
        property: sms_api_key

    - secretKey: EMAIL_SMTP_PASSWORD
      remoteRef:
        key: flowermarket/production
        property: email_smtp_password

    - secretKey: TOTP_SECRET
      remoteRef:
        key: flowermarket/production
        property: totp_secret
