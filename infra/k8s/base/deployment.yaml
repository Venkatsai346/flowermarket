---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flowermarket-api
  namespace: flowermarket
  labels:
    app.kubernetes.io/name: flowermarket
    app.kubernetes.io/component: api
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: flowermarket
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flowermarket
        app.kubernetes.io/component: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "4000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: flowermarket
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: flowermarket/api:latest
          ports:
            - name: http
              containerPort: 4000
              protocol: TCP
          envFrom:
            - secretRef:
                name: flowermarket-secrets
            - configMapRef:
                name: flowermarket-config
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "4000"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 2
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: api

---
apiVersion: v1
kind: Service
metadata:
  name: flowermarket-api
  namespace: flowermarket
  labels:
    app.kubernetes.io/name: flowermarket
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: flowermarket
    app.kubernetes.io/component: api

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flowermarket-worker
  namespace: flowermarket
  labels:
    app.kubernetes.io/name: flowermarket
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: flowermarket
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flowermarket
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: flowermarket
      containers:
        - name: worker
          image: flowermarket/api:latest
          command: ["node", "src/worker.js"]
          envFrom:
            - secretRef:
                name: flowermarket-secrets
            - configMapRef:
                name: flowermarket-config
          env:
            - name: NODE_ENV
              value: "production"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 30

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flowermarket-scheduler
  namespace: flowermarket
  labels:
    app.kubernetes.io/name: flowermarket
    app.kubernetes.io/component: scheduler
spec:
  replicas: 1
  strategy:
    type: Recreate # Only one scheduler instance
  selector:
    matchLabels:
      app.kubernetes.io/name: flowermarket
      app.kubernetes.io/component: scheduler
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flowermarket
        app.kubernetes.io/component: scheduler
    spec:
      serviceAccountName: flowermarket
      containers:
        - name: scheduler
          image: flowermarket/api:latest
          command: ["node", "src/scheduler.js"]
          envFrom:
            - secretRef:
                name: flowermarket-secrets
            - configMapRef:
                name: flowermarket-config
          env:
            - name: NODE_ENV
              value: "production"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
