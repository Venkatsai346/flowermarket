---
apiVersion: v1
kind: ConfigMap
metadata:
  name: flowermarket-config
  namespace: flowermarket
data:
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  METRICS_ENABLED: "true"
  CORS_ORIGINS: "https://flowermarket.in,https://admin.flowermarket.in"

---
apiVersion: v1
kind: Secret
metadata:
  name: flowermarket-secrets
  namespace: flowermarket
type: Opaque
# In production, use External Secrets Operator or Sealed Secrets.
# These are placeholders — real values come from AWS Secrets Manager.
stringData:
  MONGODB_URI: "mongodb://mongo:27017/flowermarket?replicaSet=rs0"
  JWT_SECRET: "CHANGE_ME_IN_PRODUCTION"
  RAZORPAY_KEY_ID: "CHANGE_ME"
  RAZORPAY_KEY_SECRET: "CHANGE_ME"

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: flowermarket-api-hpa
  namespace: flowermarket
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: flowermarket-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: flowermarket-api-pdb
  namespace: flowermarket
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: api

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: flowermarket-ingress
  namespace: flowermarket
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
spec:
  rules:
    - host: api.flowermarket.in
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: flowermarket-api
                port:
                  number: 80
    - host: admin.flowermarket.in
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: flowermarket-api
                port:
                  number: 80

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flowermarket
  namespace: flowermarket
  annotations:
    # IRSA: link to AWS IAM role for S3, SQS, etc.
    eks.amazonaws.com/role-arn: "arn:aws:iam::ACCOUNT_ID:role/flowermarket-staging-eks-node"
