# Flower Market — local development stack.
#
# Usage:
#   docker compose up -d          # start MongoDB + Redis
#   cd backend && npm run dev     # start the API server
#   cd frontend && npm run dev    # start the admin console + storefront
#
# Services:
#   - MongoDB 7 (port 27017) — primary database
#   - Redis 7 (port 6379) — rate limiting, session cache, queues
#   - Mongo Express (port 8081) — DB admin UI (optional, --profile debug)

version: '3.9'

services:
  mongodb:
    image: mongo:7
    container_name: flowermarket-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./scripts/mongo-init.js:/docker-entrypoint-initdb.d/init.js:ro
    environment:
      MONGO_INITDB_DATABASE: flowermarket
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand({ping:1})"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: flowermarket-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional: MongoDB admin UI (start with: docker compose --profile debug up)
  mongo-express:
    image: mongo-express:latest
    container_name: flowermarket-mongo-express
    restart: unless-stopped
    profiles:
      - debug
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongodb:27017/flowermarket
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  mongo_data:
    driver: local
  redis_data:
    driver: local
